<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182236"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Disc with Gold Ring -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-opacity="0.9"/>
  <!-- Golden Aura / Halo -->
  <circle cx="64" cy="56" r="42" fill="url(#halo)"/>
  <!-- Pure White Dove (Paloma Blanca del Espiritu Santo) -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Tail Feathers -->
    <path d="M64,74 C60,86 54,98 52,102 C56,100 62,94 64,88 C66,94 72,100 76,102 C74,98 68,86 64,74 Z"/>
    <!-- Left Wing -->
    <path d="M58,54 C46,42 30,36 14,40 C18,52 28,62 44,66 C50,67 56,64 58,54 Z"/>
    <!-- Right Wing -->
    <path d="M70,54 C82,42 98,36 114,40 C110,52 100,62 84,66 C78,67 72,64 70,54 Z"/>
    <!-- Dove Body -->
    <path d="M64,38 C58,46 56,58 58,72 C60,76 68,76 70,72 C72,58 70,46 64,38 Z"/>
    <!-- Head -->
    <circle cx="64" cy="35" r="8.5"/>
    <!-- Gentle Golden Beak -->
    <polygon points="64,25 61,31 67,31" fill="#fde047"/>
    <!-- Tiny Olive Branch -->
    <ellipse cx="68" cy="27" rx="4" ry="2.2" fill="#4ade80" transform="rotate(-25 68 27)"/>
  </g>
</svg>